<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />

    <title>GSC crawl stats export</title>

    <link rel="stylesheet" href="css/bootstrap.v5.3.min.css"/>
    <link rel="stylesheet" href="/bootstrap-icons-1.8.1/bootstrap-icons.css"/>

  </head>

  <body>
    <div class="container">
      <div class="row my-4">
        <div class="d-grid gap-2 col-6 mx-auto">
          <button class="btn btn-primary" type="button" id="backup">backup crawl stats data</button>
        </div>
      </div>
      <div class="row my-4">
        <div class="bg-secondary-subtle px-4 py-4 text-center" id="drop-area">
          <file-drop accept="application/zip">
            <samp>drop-area for crawl stats backup import</samp>
          </file-drop>
          <input class="center-block" type="file" id="fileInput" name="fileInput" accept="application/zip">
        </div>
      </div>
    </div>

    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/jszip.min.v3.10.1.js"></script>
    <script type="text/javascript" src="js/options.js"></script>
  </body>
</html>
