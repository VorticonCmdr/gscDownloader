<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
    <title>GSC crawl stats export</title>
  </head>

  <body>
    <div class="container-fluid p-0">

      <!-- Header bar -->
      <div class="d-flex align-items-center px-3 py-2 mb-2 border-bottom bg-white">
        <span class="fw-semibold text-secondary me-auto" style="font-size:0.85rem; letter-spacing:.04em;">GSC CRAWL STATS</span>
        <small id="userEmail" class="text-muted">
          <i class="bi bi-person-circle"></i> <span id="userEmailText"></span>
        </small>
      </div>

      <!-- Alerts -->
      <div id="notLoggedInMsg" class="px-3 mb-2" style="display: none">
        <div class="alert alert-warning mb-0" role="alert">
          <i class="bi bi-person-x-fill"></i>
          Not logged in to Google Search Console.
          <a href="https://search.google.com/search-console" target="_blank" class="alert-link">Sign in</a>
        </div>
      </div>

      <div id="errorMsg" class="px-3 mb-2" style="display: none">
        <div class="alert alert-danger mb-0" role="alert">
          <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
          <span id="errorMsgText">Download failed. Please reload the page.</span>
        </div>
      </div>

      <!-- Row A: Property bar -->
      <div class="d-flex align-items-center gap-2 px-3 mb-2">
        <input type="search" id="hostname" class="form-control form-control-sm" list="hostname-list"
          placeholder="Property…" autocomplete="off" style="max-width:280px;">
        <datalist id="hostname-list"></datalist>
<small id="dataFreshness" class="text-muted text-nowrap"></small>
      </div>

      <!-- Row B: Chart controls + actions -->
      <div class="d-flex align-items-center gap-2 px-3 mb-3 flex-wrap">
        <select id="metric" class="form-select form-select-sm" style="width:auto;">
          <option value="Total crawl requests">Total crawl requests</option>
          <option value="Total download size (Bytes)">Total download size (Bytes)</option>
          <option value="Average response time (ms)">Average response time (ms)</option>
        </select>
        <select id="category" class="form-select form-select-sm" style="width:auto;">
          <option value="response">response</option>
          <option value="file_type">file type</option>
          <option value="purpose">purpose</option>
          <option value="googlebot_type">googlebot type</option>
          <option value="summary">summary</option>
        </select>
        <div class="dropdown ms-auto">
          <button id="downloadToggleBtn" class="btn btn-primary btn-sm dropdown-toggle" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-cloud-download"></i> <span id="downloadBtnTxt"></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a id="downloadBtn" class="dropdown-item" href="#">fetch</a></li>
            <li><a id="downloadBtnSave" class="dropdown-item" href="#">fetch &amp; backup</a></li>
          </ul>
        </div>
        <button id="exportBtn" class="btn btn-outline-secondary btn-sm" type="button">
          <i class="bi bi-download"></i> CSV
        </button>
      </div>

      <!-- Chart card -->
      <div class="card shadow-sm mx-3 mb-3">
        <div class="card-header d-flex align-items-center py-1 px-3">
          <small class="text-muted text-uppercase me-auto" style="font-size:0.7rem; letter-spacing:.04em;">Chart</small>
          <button id="invertSelectionBtn" class="btn btn-outline-secondary btn-sm" type="button" style="display:none;">
            <i class="bi bi-arrow-left-right"></i> Invert
          </button>
        </div>
        <div id="chart" style="height:380px; position:relative;"></div>
      </div>

      <!-- Table card -->
      <div class="card shadow-sm mx-3 mb-5">
        <div id="table"></div>
      </div>

    </div>

    <!-- Fixed progress bar at bottom -->
    <div id="fetchBar" class="position-fixed top-0 start-0 end-0" style="display:none; z-index:1050;">
      <div id="fetchProgressLabel" class="bg-dark bg-opacity-75 text-white text-center py-1"
        style="font-size:0.75rem;"></div>
      <div class="progress rounded-0" style="height:4px;">
        <div id="fetchProgress" class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar" style="width:0%;"></div>
      </div>
    </div>

    <script type="module" src="./crawl-stats.js"></script>
  </body>
</html>
