<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />

    <title>GSC crawl stats export</title>

    <link rel="stylesheet" href="css/bootstrap.v5.3.min.css"/>
    <link rel="stylesheet" href="bootstrap-icons-1.8.1/bootstrap-icons.css"/>
    <link rel="stylesheet" href="css/bootstrap-table.min.v1.21.1.css"/>
    <link rel="stylesheet" href="css/billboard.min.v3.9.2.css"/>

  </head>

  <body>

    <div class="container-fluid mx-2 mb-4">

      <div id="errorMsg" class="row" style="display: none">
        <div class="alert alert-danger" role="alert">
          <span class="glyphicon glyphicon-warning-sign" aria-hidden="true"></span>
          <span class="sr-only">Error:</span>
          Please (re)load GSC tab to enable connection.
        </div>
      </div>

      <div id="fetchBar" class="row" style="display: none">
        <div class="progress">
          <div id="fetchProgress" class="progress-bar progress-bar-info" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 100%;"></div>
        </div>
      </div>

      <div id="chart-and-filter" class="row mt-2 me-2">
        <div id="chart" style="height: 400px; position: relative;"></div>
      </div>


      <div class="row me-2">
      	<div id="toolbar">
          <form class="row row-cols-lg-auto g-3 align-items-center">
            <div class="col-12">
              <label for="hostname">filter:</label>
            </div>

            <div class="col-12">
              <select id="hostname" class="form-select"></select>
            </div>

            <div class="col-12">
              <select id="metric" class="form-select">
                <option value="Total crawl requests">Total crawl requests</option>
                <option value="Total download size (Bytes)">Total download size (Bytes)</option>
                <option value="Average response time (ms)">Average response time (ms)</option>
              </select>
            </div>

            <div class="col-12">
              <select id="category" class="form-select">
                <option value="response">response</option>
                <option value="file_type">file type</option>
                <option value="purpose">purpose</option>
                <option value="googlebot_type">googlebot type</option>
                <option value="summary">summary</option>
              </select>
            </div>

            <div class="col-12">
              <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  download crawl stats
                </button>
                <ul class="dropdown-menu">
                  <li><a id="downloadBtn" class="dropdown-item" href="#">fetch</a></li>
                  <li><a id="downloadBtnSave" class="dropdown-item" href="#">fetch & backup</a></li>
                </ul>
              </div>
            </div>
          </form>
        </div>
        <table id="table"
          data-toolbar="#toolbar"
          data-show-export="true"
          data-export-data-type="all"
          data-sort-name="Date"
          data-sort-order="desc"
          data-pagination="true"
          data-page-size="100"
          data-page-list="[10,100,1000]"
          data-show-button-text="true"
          data-show-columns="true">
        </table>

      </div>

    </div><!-- /.container -->

    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/jszip.min.v3.10.1.js"></script>
    <script type="text/javascript" src="js/papaparse.min.v5.3.2.js"></script>
    <script type="text/javascript" src="js/d3.v6.min.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/billboard.min.v3.9.2.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.v5.3.min.js"></script>
    <script type="text/javascript" src="js/tableExport.min.v1.22.0.js"></script>
    <script type="text/javascript" src="js/bootstrap-table.min.v1.21.1.js"></script>
    <script type="text/javascript" src="js/bootstrap-table-export.min.js"></script>
    <script type="text/javascript" src="js/handlebars.min-v4.7.7.js"></script>
    <script type="text/javascript" src="js/crawl-stats.js"></script>

  </body>
</html>
